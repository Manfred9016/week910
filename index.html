    <script>
        function initParticles() {
            const canvas = document.getElementById('particles');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particlesArray = [];
            const colors = ['#38bdf8', '#818cf8', '#cbd5e1'];

            for (let i = 0; i < 40; i++) {
                particlesArray.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 1.5 + 0.5,
                    speedY: Math.random() * 0.5 - 0.25,
                    speedX: Math.random() * 0.5 - 0.25,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < particlesArray.length; i++) {
                    let p = particlesArray[i];
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    
                    p.x += p.speedX;
                    p.y += p.speedY;

                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;
                }
                requestAnimationFrame(animate);
            }
            animate();
        }

        function scrambleString(str) {
            let arr = str.split('');
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            let scrambled = arr.join('');
            if (scrambled === str && str.length > 3) return scrambleString(str);
            return scrambled;
        }

                    </div>
                    <h2 style="margin-top:0;">Unscramble</h2>
                    
                    <div style="font-size: 2.5rem; font-weight: bold; letter-spacing: 5px; color: var(--neon-blue); margin: 1.8rem 0; font-family: 'Playfair Display', serif;">
                        ${scrambledWord.toUpperCase()}
                    </div>
                    
                    <input type="text" id="unscramble-input" placeholder="Type correct word..." autocomplete="off">
                    
                    <button class="action-btn" onclick="checkVocabUnscramble('${originalWord}')">Check</button>
                </div>
            `;
        }

        function checkVocabUnscramble(correctWord) {
            const inputEl = document.getElementById('unscramble-input');
            const userWord = inputEl.value.trim().toLowerCase();
            
            if (userWord === correctWord.toLowerCase()) {
                inputEl.style.borderColor = 'var(--neon-green)';
                inputEl.style.color = 'var(--neon-green)';
                updateXP(15);
                setTimeout(() => {
                    currentVocabUnscrambleIndex++;
                    if (currentVocabUnscrambleIndex >= currentLevel.unscrambleWords.length) {
                        alert("Great job! (+50 TP)");
                        updateXP(50);
                        renderMenu();
                    } else {
                        renderVocabUnscramble();
                    }
                }, 800);
            } else {
                inputEl.style.borderColor = 'var(--neon-red)';
                inputEl.classList.add('shake');
                setTimeout(() => inputEl.classList.remove('shake'), 400);
            }
        }

        function startSentenceUnscramble() {
            if(currentLevel.sentences.length === 0) {
                alert("Sentence Builder coming soon!");
                return;
            }
            currentSentenceIndex = 0;
            renderSentenceUnscramble();
        }

        function renderSentenceUnscramble() {
            const sentencesList = currentLevel.sentences;
            const sentence = sentencesList[currentSentenceIndex];
            let words = sentence.split(' ');
            
            let scrambledWords = [...words];
            for (let i = scrambledWords.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [scrambledWords[i], scrambledWords[j]] = [scrambledWords[j], scrambledWords[i]];
            }

            const wordsHTML = scrambledWords.map((w, i) => 
                `<div class="draggable-word" id="word-${i}" onclick="moveWordOnClick(this)">${w}</div>`
            ).join('');

            appContainer.innerHTML = `
                <button class="action-btn" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Hub</button>
                <div class="reading-container animate-pop">
                    <div style="display:flex; justify-content:space-between; color:var(--text-muted); margin-bottom:1rem; font-size:0.9rem;">
                        <span>SENTENCE ${currentSentenceIndex + 1} OF ${sentencesList.length}</span>
                    </div>
                    <h2 style="margin-top:0;">Build the Sentence</h2>
                    <p style="color:var(--text-muted);">Click words in order.</p>
                    
                    <div id="sentence-answer-zone" class="sentence-dropzone"></div>
                    <div id="sentence-word-bank" class="word-bank">${wordsHTML}</div>
                    
                    <button class="action-btn" onclick="checkSentenceUnscramble('" + sentence.replace(/'/g, "\\'") + "')">Submit</button>
                </div>
            `;
        }

        function moveWordOnClick(element) {
            const answerZone = document.getElementById('sentence-answer-zone');
            const wordBank = document.getElementById('sentence-word-bank');
            
            if (element.parentNode.id === 'sentence-word-bank') {
                answerZone.appendChild(element);
            } else {
                wordBank.appendChild(element);
            }
        }

        function checkSentenceUnscramble(correctSentence) {
            const answerZone = document.getElementById('sentence-answer-zone');
            const currentWords = Array.from(answerZone.children).map(el => el.innerText);
            const userSentence = currentWords.join(' ');
            
            if (userSentence === correctSentence) {
                answerZone.style.borderColor = 'var(--neon-green)';
                updateXP(25);
                setTimeout(() => {
                    currentSentenceIndex++;
                    if (currentSentenceIndex >= currentLevel.sentences.length) {
                        alert("Excellent! (+50 TP)");
                        updateXP(50);
                        renderMenu();
                    } else {
                        renderSentenceUnscramble();
                    }
                }, 1000);
            } else {
                answerZone.style.borderColor = 'var(--neon-red)';
                answerZone.classList.add('shake');
                setTimeout(() => answerZone.classList.remove('shake'), 400);
            }
        }

        function startMissionChallenge() {
            missionChallengeIndex = 0;
            activeMissions = [...spaceDB].sort(() => 0.5 - Math.random());
            renderMissionChallenge();
        }

        function renderMissionChallenge() {
            if (missionChallengeIndex >= activeMissions.length) {
                alert("Concept Challenge Complete!");
                return renderMenu();
            }

            const currentMission = activeMissions[missionChallengeIndex];
            
            let options = [currentMission.name];
            let pool = ALL_MISSIONS.filter(name => name !== currentMission.name);
            pool.sort(() => 0.5 - Math.random());
            options.push(...pool.slice(0, 3));
            options.sort(() => 0.5 - Math.random()); 

            appContainer.innerHTML = `
                <button class="action-btn" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Hub</button>
                <div class="reading-container animate-pop" style="padding-bottom: 1.5rem; text-align: center;">
                    <div style="display:flex; justify-content:space-between; color:var(--text-muted); margin-bottom:1rem; font-size:0.9rem;">
                        <span>CONCEPT ${missionChallengeIndex + 1} OF ${activeMissions.length}</span>
                    </div>

                    <div style="background: rgba(255, 255, 255, 0.05); padding: 0.8rem; border-radius: 2px; margin-bottom: 1.5rem; border-left: 2px solid var(--neon-blue); text-align: center;">
                        <span style="color: var(--text-main); font-size: 1.1rem; font-weight:bold;">${currentMission.category}</span>
                    </div>

                    <div id="mission-feedback-zone">
                        <img src="${currentMission.img}" alt="Concept Image" class="ai-logo-frame">
                    </div>

                    <h3 style="color: #fff; margin-bottom: 1.2rem;">Identify this concept:</h3>

                    <div class="card-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                        ${options.map(opt => `
                            <button class="action-btn" style="margin-top: 0; padding: 1.1rem 0.8rem; font-size: 0.95rem; line-height: 1.3;" onclick="checkMissionGuess(this, '${opt}', '${currentMission.name}')">${opt}</button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function checkMissionGuess(btn, selected, correct) {
            const allButtons = btn.parentElement.querySelectorAll('button');
            allButtons.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correct) {
                btn.classList.add('btn-correct');
                updateXP(20);
                setTimeout(() => {
                    missionChallengeIndex++;
                    renderMissionChallenge();
                }, 1000);
            } else {
                btn.classList.add('btn-wrong');
                const feedbackZone = document.getElementById('mission-feedback-zone');
                feedbackZone.innerHTML = `
                    <div style="color: var(--neon-red); font-size: 1.3rem; font-weight: bold; margin: 2rem 0; font-family: 'Playfair Display', serif;">
                        Incorrect! This is ${correct}.
                    </div>`;
                setTimeout(() => {
                    missionChallengeIndex++;
                    renderMissionChallenge(); 
                }, 2000);
            }
        }

        function startAppChallenge() {
            appChallengeIndex = 0;
            activeSpaceApps = [...spaceAppsDB].sort(() => 0.5 - Math.random());
            renderAppChallenge();
        }

        function renderAppChallenge() {
            if (appChallengeIndex >= activeSpaceApps.length) {
                alert("Emoji Challenge Complete!");
                return renderMenu();
            }

            const currentApp = activeSpaceApps[appChallengeIndex];
            
            let options = [currentApp.name];
            let pool = ALL_SPACE_APPS.filter(n => n !== currentApp.name);
            pool.sort(() => 0.5 - Math.random());
            options.push(...pool.slice(0, 3));
            options.sort(() => 0.5 - Math.random()); 

            appContainer.innerHTML = `
                <button class="action-btn" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Hub</button>
                <div class="reading-container animate-pop" style="padding-bottom: 1.5rem; text-align: center;">
                    <div style="display:flex; justify-content:space-between; color:var(--text-muted); margin-bottom:1rem; font-size:0.9rem;">
                        <span>EMOJI ${appChallengeIndex + 1} OF ${activeSpaceApps.length}</span>
                    </div>

                    <div id="app-feedback-zone" style="min-height: 200px; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--neon-blue); border-radius: 2px; margin-bottom: 1.8rem;">
                        <span style="font-size: 4.5rem; user-select: none;">${currentApp.emoji}</span>
                    </div>

                    <h3 style="color: #fff; margin-bottom: 1.2rem;">What does this represent?</h3>

                    <div class="card-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                        ${options.map(opt => `
                            <button class="action-btn" style="margin-top: 0; padding: 1.1rem 0.6rem; font-size: 0.95rem; line-height: 1.3;" onclick="checkAppGuess(this, '${opt}', '${currentApp.name}')">${opt}</button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function checkAppGuess(btn, selected, correct) {
            const allButtons = btn.parentElement.querySelectorAll('button');
            allButtons.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correct) {
                btn.classList.add('btn-correct');
                updateXP(20);
                setTimeout(() => {
                    appChallengeIndex++;
                    renderAppChallenge();
                }, 1000);
            } else {
                btn.classList.add('btn-wrong');
                const feedbackZone = document.getElementById('app-feedback-zone');
                feedbackZone.innerHTML = `
                    <span style="display: block; color: var(--neon-red); font-size: 1.2rem; font-weight: bold; margin: 1.5rem 0; font-family: 'Playfair Display', serif;">
                        Incorrect! Represents: ${correct}.
                    </span>`;
                setTimeout(() => {
                    appChallengeIndex++;
                    renderAppChallenge(); 
                }, 2000);
            }
        }

        function startSynonymMatch() {
            if (!currentLevel.synonyms || currentLevel.synonyms.length === 0) {
                alert("No synonyms available for this level.");
                return;
            }
            synonymChallengeIndex = 0;
            activeSynonyms = [...currentLevel.synonyms].sort(() => 0.5 - Math.random());
            renderSynonymMatch();
        }

        function renderSynonymMatch() {
            if (synonymChallengeIndex >= activeSynonyms.length) {
                alert("Synonym Challenge Complete. (+50 TP Bonus)");
                updateXP(50);
                return renderMenu();
            }

            const currentPair = activeSynonyms[synonymChallengeIndex];
            
            let options = [currentPair.synonym];
            let pool = currentLevel.synonyms
                .map(s => s.synonym)
                .filter(syn => syn !== currentPair.synonym);
            
            pool.sort(() => 0.5 - Math.random());
            options.push(...pool.slice(0, 3));
            options.sort(() => 0.5 - Math.random());

            appContainer.innerHTML = `
                <button class="action-btn" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Hub</button>
                <div class="reading-container animate-pop" style="padding-bottom: 1rem; text-align: center;">
                    <div style="display:flex; justify-content:space-between; color:var(--text-muted); margin-bottom:1rem; font-size:0.9rem;">
                        <span>SYNONYM ${synonymChallengeIndex + 1} OF ${activeSynonyms.length}</span>
                    </div>

                    <h2 style="color: #fff; margin-bottom: 0.5rem;">Find the closest synonym for:</h2>
                    
                    <div style="background: rgba(255, 255, 255, 0.05); padding: 1.8rem; border-radius: 2px; margin-bottom: 2rem; border: 1px dotted #666; text-align: center;">
                        <strong style="color: var(--neon-blue); font-family: 'Playfair Display', serif; font-size: 2.2rem; letter-spacing: 2px; text-transform: uppercase;">
                            ${currentPair.word}
                        </strong>
                    </div>

                    <div class="card-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                        ${options.map(opt => `
                            <button class="action-btn" style="margin-top: 0; padding: 1.2rem; font-size: 1.05rem;" onclick="checkSynonymGuess(this, '${opt}', '${currentPair.synonym}')">${opt}</button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function checkSynonymGuess(btn, selected, correct) {
            const allButtons = btn.parentElement.querySelectorAll('button');
            allButtons.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correct) {
                btn.classList.add('btn-correct');
                updateXP(15);
                setTimeout(() => {
                    synonymChallengeIndex++;
                    renderSynonymMatch();
                }, 1000);
            } else {
                btn.classList.add('btn-wrong');
                btn.classList.add('shake');
                
                allButtons.forEach(b => {
                    if (b.innerText === correct) {
                        b.classList.add('btn-correct');
                    }
                });

                setTimeout(() => {
                    synonymChallengeIndex++;
                    renderSynonymMatch(); 
                }, 2000);
            }
        }

        init();
    </script>
</body>
</html>
